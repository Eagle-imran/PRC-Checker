[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prc-checker"
version = "1.0.0"
description = "MahaBhulekh Property Card Fetcher, Title Auditor, and Data Exporter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Imran Patel" }
]
dependencies = [
    "playwright>=1.44.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
prc-checker = "prc_checker.cli:main"

[tool.setuptools.packages.find]
include = ["prc_checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "SIM102", "RUF015", "EXE001", "S110"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

